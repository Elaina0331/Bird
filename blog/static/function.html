<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>钢铁笨</title>
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="function.css"> 
</head>
<body>
    <div id="windows">
        <video id="video" autoplay="autoplay"></video>
        <canvas id="canvas"></canvas>
    </div>
    <div id="command">
        <!-- 小车姿态 -->
        <div id="carCommand1">
             <p id="myStatus1">姿态1</p>
        	<img id="myImg1" src="Photo/姿态1.png" width="80%" height="90%" />
        </div> 
        <div id="carCommand2">
             <p id="myStatus2">上行</p>
            <img id="myImg2" src="Photo/上行.png" width="80%" height="90%" />
        </div> 
        <!-- 按键调整 -->
        <div id="myButton">
                <input type="button" title="拍照(j)" value="拍照" onclick="takePhoto()"><br>
                <input type="button" title="删除照片(h)" value="删除照片" onclick="clearPhoto()"><br>
                <input type="button" title="下载图片(k)" value="下载图片" onclick="downloadImg()"><br>
                <input type="button" title="姿态1(1)" value="姿态1" onclick="carCommand1()"><br>
                <input type="button" title="姿态2(2)" value="姿态2" onclick="carCommand2()"><br>
                <input type="button" title="姿态3(3)" value="姿态3" onclick="carCommand3()"><br>
                <input type="button" title="姿态4(4)" value="姿态4" onclick="carCommand4()"><br>
                <input type="button" title="上行(q)" value="上行" onclick="carCommand5()"><br>
                <input type="button" title="下行(e)" value="下行" onclick="carCommand6()"><br>
                <input type="button" title="启用云台(f)" value="云台" onclick="carCommand7()"><br>
                <input type="button" title="越野步态(t)" value="越野步态" onclick="carCommand8()">
        </div>
    </div>
    <!-- JavaScript -->
    <script src="JavaScript\video.js"></script><!-- 管理摄像头功能的JavaScript文件 -->
    <script src="JavaScript\command.js"></script><!-- 管理小车命令的JavaScript文件 -->      

</body></html>
